name: Android CI & Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Prepare Keystore & Environment Files
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue || true

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == null }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'release' || github.event.inputs.build_target == null }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Organize APK Artifacts
        run: |
          mkdir -p output-apks
          if [ -d "app/build/outputs/apk/debug" ]; then
            cp -v app/build/outputs/apk/debug/*.apk output-apks/MB-Taker-debug.apk || cp -v app/build/outputs/apk/debug/*.apk output-apks/ || true
          fi
          if [ -d "app/build/outputs/apk/release" ]; then
            cp -v app/build/outputs/apk/release/*.apk output-apks/MB-Taker-release.apk || cp -v app/build/outputs/apk/release/*.apk output-apks/ || true
          fi
          ls -la output-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MB-Taker-APKs
          path: output-apks/*
          if-no-files-found: error
